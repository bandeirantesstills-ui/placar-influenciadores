<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Influenciadores · Painel de acompanhamento</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* =========================================================
   INFLUENCIADORES · Painel de acompanhamento (Back Office · Still)
   Mesmo tema da apresentação: noite #160E20, manchas de luz,
   ondas em gradiente, Permanent Marker + Anton + Poppins.
   ========================================================= */
:root{
  --night:#160E20; --ink:#17121F; --glass:#221632; --deep:#0d0814;
  --orange:#FF7A00; --pink:#E5307A; --blue:#1A6BFF; --purple:#7B2FF7;
  --yellow:#FFC21A; --sky:#27B4FF; --green:#35B24A;
  --txt:#fff; --txt-2:rgba(255,255,255,.74); --txt-3:rgba(255,255,255,.52);
  --line:rgba(255,255,255,.12);
  --f-brush:"Permanent Marker","Comic Sans MS",cursive;
  --f-cond:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Poppins","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--night)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--night);color:var(--txt);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow-x:hidden}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}

/* ---------- luz e ondas ---------- */
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(80px);opacity:.42}
.b1{left:-180px;top:-200px;background:var(--orange);animation:drift 16s ease-in-out infinite}
.b2{right:-200px;top:-120px;background:var(--pink);animation:drift 19s ease-in-out infinite reverse}
.b3{left:30%;bottom:-320px;background:var(--purple);animation:drift 22s ease-in-out infinite}
.b4{right:-160px;bottom:-260px;background:var(--blue);opacity:.32;animation:drift 18s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate(60px,40px) scale(1.12)}}
.waves{position:fixed;left:0;right:0;bottom:0;height:70px;overflow:hidden;pointer-events:none;z-index:1;opacity:.9}
.waves svg{position:absolute;bottom:0;left:0;width:3200px;height:100%}
.waves .w1{animation:wave 22s linear infinite;opacity:.45}
.waves .w2{animation:wave 15s linear infinite reverse;opacity:.7}
.waves .w3{animation:wave 10s linear infinite}
@keyframes wave{to{transform:translateX(-1600px)}}

.wrap{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:22px 20px 120px}

/* ---------- topo ---------- */
.topo{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{position:relative;display:inline-block;padding:14px 30px 12px;margin:14px 6px 4px 10px}
.logo .splash{position:absolute;inset:-8px -12px;background:linear-gradient(100deg,var(--orange),var(--pink) 45%,var(--purple) 75%,var(--blue));border-radius:52% 48% 58% 42% / 46% 60% 40% 54%;transform:rotate(2deg) skew(-12deg)}
.logo .brush{position:absolute;inset:0;background:var(--ink);border-radius:46% 54% 42% 58% / 60% 44% 56% 40%;transform:rotate(-3deg) skew(-10deg);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.logo .word{position:relative;font-family:var(--f-brush);font-size:clamp(26px,5vw,40px);line-height:1;color:var(--yellow);display:block;transform:rotate(-3deg)}
.logo .word b{color:var(--sky);font-weight:400}
.logo .crown{position:absolute;left:16px;top:-22px;width:42px;transform:rotate(-16deg);z-index:2}
.meta-topo{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chip{font-family:var(--f-cond);letter-spacing:.1em;font-size:15px;text-transform:uppercase;background:#fff;color:var(--ink);padding:6px 14px 5px;border-radius:4px;transform:skew(-8deg);display:inline-block}
.upd{font-size:13px;color:var(--txt-2);text-align:right}
.upd b{color:#fff;font-weight:700}

.titulo{margin:26px 0 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.titulo h1{font-family:var(--f-brush);font-weight:400;font-size:clamp(34px,6vw,58px);line-height:1.02}
.titulo .periodo{font-size:15px;color:var(--txt-2);margin-top:6px}
.tag-parcial{display:inline-block;margin-left:8px;font-size:12px;font-weight:800;color:var(--ink);background:var(--yellow);padding:2px 9px;border-radius:999px;vertical-align:2px}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-family:var(--f-cond);font-size:18px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);padding:8px 18px 6px;border-radius:6px;transform:skew(-8deg);cursor:pointer}
.tab span{display:inline-block;transform:skew(8deg)}
.tab[aria-selected="true"]{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.tab.tri[aria-selected="true"]{background:linear-gradient(100deg,var(--orange),var(--pink),var(--purple));color:#fff;border-color:transparent}
.tab:disabled{opacity:.38;cursor:not-allowed}
.tab small{font-family:var(--f-body);font-size:11px;letter-spacing:0;margin-left:6px;text-transform:none}

/* ---------- avisos ---------- */
.avisos{margin-top:18px;background:rgba(255,194,26,.12);border:1.5px solid rgba(255,194,26,.55);border-radius:14px;padding:12px 16px;font-size:14px}
.avisos h4{font-size:14px;font-weight:800;color:var(--yellow);margin-bottom:4px}
.avisos ul{margin:0;padding-left:18px;color:var(--txt-2)}
.avisos li{margin:2px 0}

/* ---------- painel (tela 11) ---------- */
.dash{margin-top:22px;background:var(--deep);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 22px 50px rgba(0,0,0,.35)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:rgba(255,255,255,.07);border-radius:14px;padding:14px 16px;min-width:0}
.kpi small{display:block;font-family:var(--f-cond);letter-spacing:.1em;font-size:13px;color:var(--txt-3);text-transform:uppercase}
.kpi div{font-family:var(--f-cond);font-size:34px;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi div span{font-size:15px;font-family:var(--f-body);color:var(--txt-2)}
.kpi .vazio{font-family:var(--f-body);font-size:14px;line-height:1.35;color:var(--txt-2);padding-top:6px}
.kpi.ouro div{color:var(--yellow)}

/* pódio */
.podio-box{margin-top:16px;display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:stretch}
.pbox{background:rgba(255,255,255,.05);border-radius:18px;padding:16px 18px;min-width:0}
.pbox h3{font-family:var(--f-brush);font-weight:400;font-size:24px;line-height:1.1}
.pbox .sub{font-size:13px;color:var(--txt-2);margin-top:2px}
.podio{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin-top:18px}
.degrau{text-align:center;min-width:0}
.degrau .nm{font-family:var(--f-cond);font-size:20px;letter-spacing:.04em;line-height:1.1;overflow-wrap:anywhere}
.degrau .gc{font-size:12px;color:var(--txt-2)}
.degrau .pts{font-size:13px;font-weight:700;margin:2px 0 6px}
.degrau .bloco{border-radius:12px 12px 4px 4px;display:grid;place-items:center;font-family:var(--f-cond);font-size:34px;color:var(--ink)}
.d1 .bloco{height:110px;background:linear-gradient(180deg,var(--yellow),var(--orange))}
.d2 .bloco{height:78px;background:linear-gradient(180deg,#e9e3f2,#b8aecb)}
.d3 .bloco{height:58px;background:linear-gradient(180deg,#ffb27a,#c76a2a)}
.degrau .ic{font-size:34px;line-height:1;display:block;margin-bottom:2px;filter:drop-shadow(0 6px 16px rgba(255,194,26,.5))}
.degrau.vago .bloco{background:rgba(255,255,255,.08);color:var(--txt-3)}
.corrida{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.corrida li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.corrida .pos{font-family:var(--f-cond);font-size:22px;width:28px;text-align:center;color:var(--txt-3)}
.corrida .nm{font-weight:700}
.corrida .nm small{display:block;font-weight:500;font-size:12px;color:var(--txt-2)}
.corrida .falta{font-size:12px;color:var(--txt-2);text-align:right}
.corrida .falta b{display:block;font-family:var(--f-cond);font-size:20px;font-weight:400;color:var(--orange)}
.lider{display:flex;gap:14px;align-items:center;margin-top:14px}
.lider .tro{font-size:54px;line-height:1;filter:drop-shadow(0 8px 20px rgba(255,194,26,.45))}
.lider .nm{font-family:var(--f-cond);font-size:30px;letter-spacing:.04em;color:var(--yellow);line-height:1.1}
.lider .det{font-size:13px;color:var(--txt-2)}
.msg-vazia{font-size:14px;color:var(--txt-2);margin-top:12px}

/* tabela */
.tabela-wrap{margin-top:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.dt{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
.dt th{font-family:var(--f-cond);font-weight:400;letter-spacing:.08em;font-size:13px;color:var(--txt-3);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;white-space:nowrap}
.dt th:first-child,.dt td:first-child{text-align:left}
.dt td{padding:9px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,.07);font-variant-numeric:tabular-nums;white-space:nowrap}
.dt td:first-child{font-weight:700}
.dt td:first-child small{font-weight:500;color:var(--txt-2)}
.dt tr.top1 td{background:rgba(255,194,26,.08)}
.dt td.pt{font-family:var(--f-cond);font-size:18px;letter-spacing:.02em}
.dt .z{color:var(--txt-3)}
.mini{display:inline-block;width:62px;height:7px;border-radius:999px;background:rgba(255,255,255,.12);vertical-align:middle;margin-left:8px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:999px}

.stt{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.stt.rei{background:var(--yellow);color:var(--ink)}
.stt.bat{background:rgba(53,178,74,.25);color:#8be889}
.stt.perto{background:rgba(255,194,26,.2);color:var(--yellow)}
.stt.ne{background:rgba(26,107,255,.22);color:#9cc0ff}
.stt.abx{background:rgba(229,48,122,.2);color:#ff8fb8}
.stt.fora{background:rgba(255,255,255,.08);color:var(--txt-2)}

/* ---------- telas (vistas) ---------- */
.vista{animation:entra .35s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{opacity:0;transform:translateY(14px)}}
.vista-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
.vista-head h2{font-family:var(--f-brush);font-weight:400;font-size:clamp(24px,3.6vw,32px);line-height:1.05}
.vista-head p{font-size:13px;color:var(--txt-2);margin-top:4px}
.atalhos{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.atalho{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer}
.atalho:hover{background:rgba(255,255,255,.14)}
.dt tbody tr{cursor:pointer}
.dt tbody tr:hover td{background:rgba(255,255,255,.04)}

/* barra de navegação entre telas */
.navbar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;gap:4px;background:rgba(13,8,20,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.navbar button{border:0;background:none;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;display:flex;gap:7px;align-items:center;cursor:pointer;color:var(--txt-2);white-space:nowrap}
.navbar button .ic{font-size:16px}
.navbar button[aria-current="page"]{background:#fff;color:var(--ink)}

/* tela Gerências: mosaico */
.busca{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--txt-2)}
.busca select{font:inherit;font-size:14px;color:#fff;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{position:relative;text-align:left;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;transition:border-color .2s,transform .2s}
.tile:hover{border-color:rgba(255,255,255,.4);transform:translateY(-2px)}
.tile.rei{border:2px solid var(--yellow);box-shadow:0 10px 28px rgba(255,194,26,.25)}
.tile .t1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tile .rk{font-family:var(--f-cond);font-size:22px;color:var(--txt-3);line-height:1}
.tile .pt{font-family:var(--f-cond);font-size:24px;line-height:1}
.tile .pt small{font-family:var(--f-body);font-size:11px;color:var(--txt-2);margin-left:3px}
.tile .pl{font-family:var(--f-brush);font-size:19px;line-height:1.1;margin-top:8px;overflow-wrap:anywhere}
.tile .gg{font-size:11px;color:var(--txt-2)}
.tile .bb{display:grid;gap:4px;margin:10px 0 10px}
.tile .bb span{display:block;height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.tile .bb i{display:block;height:100%;border-radius:9px}
.tile .stt{align-self:flex-start;font-size:11px;padding:3px 9px}
.tile .cr{position:absolute;right:10px;top:-14px;font-size:22px}

/* detalhe da Gerência (janela) */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(5,2,10,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fundo .25s ease}
@keyframes fundo{from{opacity:0}}
.modal .card{position:relative;width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px 20px 16px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:sobe .3s cubic-bezier(.2,.8,.2,1);outline:3px solid transparent}
@keyframes sobe{from{opacity:0;transform:translateY(24px) scale(.98)}}
.modal .card.rei{outline-color:var(--yellow)}
.fechar{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:18px;cursor:pointer;line-height:1}
.card .rib{display:inline-block;background:var(--ink);color:var(--yellow);font-family:var(--f-cond);font-size:13px;letter-spacing:.1em;padding:4px 10px;border-radius:6px;border:1px solid rgba(255,194,26,.5);margin-bottom:10px}
.card .cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding-right:44px}
.card .plat{font-family:var(--f-brush);font-size:30px;line-height:1.05}
.card .gcn{font-size:12px;color:var(--txt-2);margin-top:2px}
.card .rk{text-align:right;flex:none}
.card .rk b{display:block;font-family:var(--f-cond);font-size:30px;font-weight:400;line-height:1}
.card .rk small{font-size:11px;color:var(--txt-3)}
.card .frase{font-size:13px;color:var(--txt-2);margin-top:6px}
.card .linha-st{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 4px}
.card .total{font-family:var(--f-cond);font-size:22px}
.card .total span{font-family:var(--f-body);font-size:12px;color:var(--txt-2)}
.legenda{font-size:11.5px;color:var(--txt-2);display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.legenda i{display:inline-block;width:2px;height:12px;vertical-align:-2px;margin-right:5px}
.pilar{margin-top:12px}
.pilar .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.pilar .lab b{font-family:var(--f-cond);font-weight:400;letter-spacing:.08em;font-size:14px}
.pilar .lab span{color:var(--txt-2)}
.pilar .lab span strong{color:#fff}
.barra{position:relative;height:12px;border-radius:999px;background:rgba(255,255,255,.1)}
.barra .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;max-width:100%}
.barra .mk{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px}
.barra .mk.min{background:rgba(255,255,255,.75)}
.barra .mk.trv{background:var(--yellow)}
.barra .mk.cem{background:rgba(255,255,255,.35);width:1px}
.pilar .det{font-size:11.5px;color:var(--txt-3);margin-top:5px}
.pilar .det .estrela{color:var(--yellow);font-weight:700}
.premio{margin-top:14px;font-size:12.5px;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;color:var(--txt-2)}
.premio b{color:#fff}
.time{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.time h4{font-family:var(--f-cond);font-weight:400;letter-spacing:.08em;font-size:13px;color:var(--txt-3);margin-bottom:6px}
.time ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.time li{display:flex;gap:8px;align-items:baseline;font-size:13px}
.time li .cg{flex:none;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(39,180,255,.18);color:#8fd5ff}
.time li .cg.as{background:rgba(229,48,122,.2);color:#ff9cc3}
.meses-pts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.meses-pts div{background:rgba(255,255,255,.06);border-radius:10px;padding:8px;text-align:center;font-size:11px;color:var(--txt-2)}
.meses-pts div b{display:block;font-family:var(--f-cond);font-weight:400;font-size:20px;color:#fff}
.passo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.passo button{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.passo span{font-size:12px;color:var(--txt-3)}

/* nível 3 */
.nivel3{margin-top:16px;display:flex;align-items:center;gap:14px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 14px,transparent 14px 28px);border:1.5px dashed rgba(255,255,255,.25);border-radius:16px;padding:12px 18px}
.nivel3 .cad{font-size:26px}
.nivel3 b{font-family:var(--f-cond);font-weight:400;letter-spacing:.1em;font-size:16px}
.nivel3 p{font-size:12.5px;color:var(--txt-2)}
.regras{margin-top:16px;font-size:12.5px;color:var(--txt-2);line-height:1.6}
.regras b{color:#fff}

/* ---------- carregamento ---------- */
.estado{margin-top:40px;text-align:center;color:var(--txt-2)}

/* ---------- versão compacta: cada tela cabe sem rolar ---------- */
.wrap{padding:16px 20px 96px}
.topo{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 22px}
.logo{padding:10px 22px 8px;margin:10px 4px 2px 8px}
.logo .word{font-size:30px}
.logo .crown{width:32px;left:12px;top:-17px}
.titulo{margin:0;display:block;min-width:0}
.titulo h1{font-size:clamp(24px,2.7vw,36px);white-space:nowrap}
.titulo .periodo{font-size:13px;margin-top:2px}
.dir{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.tab{font-size:15px;padding:6px 14px 4px}
.linha-upd{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.upd{font-size:12px;text-align:right}
.avisos{position:relative;margin:0;background:none;border:0;padding:0}
.av-btn{font-size:12px;font-weight:700;color:var(--yellow);background:rgba(255,194,26,.12);border:1px solid rgba(255,194,26,.45);border-radius:999px;padding:2px 10px;cursor:pointer;white-space:nowrap}

<script>
/* =========================================================
   CONFIGURAÇÃO
   O painel lê os arquivos dados/placar-AAAA-MM.json, gerados
   pela ferramenta local "Preparar placar". Os Excel originais
   nunca vão para o site.
   ========================================================= */
const CONFIG = {
  meses: [
    { id: "2026-10", nome: "Outubro",  curto: "Out" },
    { id: "2026-11", nome: "Novembro", curto: "Nov" },
    { id: "2026-12", nome: "Dezembro", curto: "Dez" }
  ],
  pasta: "dados",
  arquivo: id => `placar-${id}.json`
};

/* ---------- regras do programa ---------- */
const REGRAS = {
  engaja:  { min: 90, trava: 130 },
  ativa:   { min: 90, trava: 130 },
  conecta: { min: 50, trava: 100 },
  conectaAT: { min: 60, trava: 100 },
  bateu: 100, perto: 95, trimestreMin: 90
};
const GCS = {
  G1:["TREND","Quem dita a tendência e puxa o resultado para cima."],
  G2:["VIRAL","Resultado que se espalha rápido por toda a Gerência."],
  G3:["CREATOR","Cria as oportunidades e transforma ideia em venda."],
  AP:["ALCANCE","Leva a mensagem a cada cliente da carteira."],
  AN:["AUDIÊNCIA","Conhece o cliente e mantém todo mundo ligado."],
  AT:["ATITUDE","Força e iniciativa para buscar a meta todo dia."],
  SL:["IMPULSO","Dá o empurrão que faz o resultado decolar."],
  RV:["RESULTADO","Foco total no alvo: bater a meta."],
  IT:["INOVAÇÃO","Novas formas de usar as ferramentas comerciais."],
  MO:["MOVIMENTO","Ritmo constante, sempre para frente."],
  GU:["CRESCIMENTO","Evolução mês a mês, ponto a ponto."],
  PO:["POTENCIAL","Energia guardada pronta para virar resultado."],
  UR:["UNIÃO","Cada peça encaixada para o time ganhar junto."],
  RI:["INSPIRAÇÃO","O exemplo que motiva as outras Gerências."],
  PA:["PARCERIA","Back Office e vendas lado a lado."],
  DI:["DISCIPLINA","Rotina de acompanhamento que não falha."]
};
const SIGLAS = Object.keys(GCS);
/* ---------- figurinhas e "minha Gerência" ---------- */
const fig = g => `figurinhas/${g}.webp`;
const giro = g => ((SIGLAS.indexOf(g) * 37) % 9 - 4) * 1.1;   /* inclinação fixa por GC, para parecer colada à mão */
const minhaGC = {
  get(){ try { return localStorage.getItem("minhaGC") || ""; } catch(e){ return ""; } },
  set(g){ try { g ? localStorage.setItem("minhaGC", g) : localStorage.removeItem("minhaGC"); } catch(e){} }
};

const COR = { engaja:"var(--orange)", conecta:"var(--pink)", ativa:"var(--blue)" };

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const siglaGC = s => { const t = String(s ?? "").toUpperCase().replace(/^GC\.?\s*/,"").trim(); return SIGLAS.includes(t) ? t : null; };
const num = v => { if (v === null || v === undefined || v === "") return null; const n = typeof v === "number" ? v : parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
/* mostra com 1 casa; se o arredondamento levar a um limite das regras (ex.: 99,96% viraria 100,0%), corta em vez de arredondar */
const LIMITES = [50, 60, 90, 95, 100, 130];
const corta = x => { const r = Math.round(x * 10) / 10; return (r !== x && LIMITES.includes(r) && x < r) ? Math.floor(x * 10 + 1e-9) / 10 : r; };
const f1 = x => x === null || x === undefined ? "—" : corta(x).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const pct = x => x === null || x === undefined ? "—" : f1(x) + "%";
const dataBR = d => d ? d.toLocaleDateString("pt-BR") + " às " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : null;
const dataCurta = d => d ? d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}) + " " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : "—";
const pontos = (p, r) => (p === null || p < r.min) ? 0 : Math.min(p, r.trava);
const razao = (real, meta) => (real === null || !meta) ? null : real / meta * 100;
const nomeBonito = s => String(s).toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(Da|De|Do|Dos|Das|E)\b/g, w => w.toLowerCase());

/* =========================================================
   CÁLCULO
   ========================================================= */
function calcularMes(P){
  const linhasGC = SIGLAS.map(g => {
    const d = (P.gcs && P.gcs[g]) || {};
    const val = x => (typeof x === "number" && isFinite(x)) ? x : null;
    const eng = val(d.eng), con = val(d.con), ati = val(d.ati), still = val(d.still);
    const regraCon = g === "AT" ? REGRAS.conectaAT : REGRAS.conecta;
    const pE = pontos(eng, REGRAS.engaja), pC = pontos(con, regraCon), pA = pontos(ati, REGRAS.ativa);
    return { g, eng, con, ati, still, pE, pC, pA, total: pE+pC+pA, regraCon, detCon: d.conecta || null,
             pesoEng: val(d.pesoEng), pesoStill: val(d.pesoStill),
             pessoas: Array.isArray(d.equipe) ? d.equipe : [] };
  });
  const ordem = (a,b) => (b.total - a.total) || ((b.still ?? -1) - (a.still ?? -1));
  [...linhasGC].sort(ordem).forEach((l,i) => l.rank = i+1);
  const elegiveis = linhasGC.filter(l => l.eng !== null && l.eng >= REGRAS.bateu).sort(ordem);
  const rei = elegiveis[0] || null;
  linhasGC.forEach(l => {
    if (rei && l.g === rei.g) l.status = "rei";
    else if (l.eng !== null && l.eng >= REGRAS.bateu) l.status = "bat";
    else if (l.eng !== null && l.eng >= REGRAS.perto) l.status = "perto";
    else if (l.total > 0) l.status = "ne";
    else l.status = "abx";
  });
  return { linhas: linhasGC, rei, elegiveis };
}

function calcularTrimestre(meses){
  const comDados = meses.filter(m => m.calc);
  const linhasGC = SIGLAS.map(g => {
    const porMes = {}; let total = 0, eS = 0, eP = 0, sS = 0, sP = 0;
    comDados.forEach(m => {
      const l = m.calc.linhas.find(x => x.g === g);
      porMes[m.id] = l.total; total += l.total;
      /* acumulado = soma do realizado ÷ soma da meta, refeito com as metas protegidas */
      if (l.eng !== null && l.pesoEng){ eS += l.eng * l.pesoEng; eP += l.pesoEng; }
      if (l.still !== null && l.pesoStill){ sS += l.still * l.pesoStill; sP += l.pesoStill; }
    });
    const engAc = eP ? eS/eP : null, stillAc = sP ? sS/sP : null;
    const pessoas = (comDados.length && comDados[comDados.length-1].calc.linhas.find(x => x.g === g).pessoas) || [];
    return { g, porMes, total, engAc, still: stillAc, pessoas };
  });
  const ordem = (a,b) => (b.total - a.total) || ((b.still ?? -1) - (a.still ?? -1));
  [...linhasGC].sort(ordem).forEach((l,i) => l.rank = i+1);
  const eleg = linhasGC.filter(l => l.engAc !== null && l.engAc >= REGRAS.trimestreMin).sort(ordem);
  const lider = eleg[0] || null;
  linhasGC.forEach(l => l.status = lider && l.g === lider.g ? "lider" : (l.engAc !== null && l.engAc >= REGRAS.trimestreMin ? "disputa" : "fora"));
  return { linhas: linhasGC, lider, eleg, meses: comDados };
}

const STATUS_CLI = { d1:["d1","✅ Comprou"], online:["online","🛒 Comprou online"], pendente:["pendente","⏳ Pendente"] };
const PF = { gc: null, st: "todos", b2b: "todos", q: "", rota: "", dia: "" };   /* filtros da tela */
const DIAS = [["Seg","Segunda"],["Ter","Terça"],["Qua","Quarta"],["Qui","Quinta"],["Sex","Sexta"],["Sab","Sábado"]];
const visitaTem = (v, d) => String(v || "").split(/\s*-\s*/).some(x => norm(x).startsWith(norm(d)));

function mesPlanificador(){
  const c = contexto();
  if (!c.tri) return (c.m.clientes || []).length ? c.m : null;
  const com = STATE.meses.filter(m => m.calc && (m.clientes || []).length);
  return com[com.length - 1] || null;
}

function filtrarClientes(m){
  const q = norm(PF.q);
  return m.clientes.filter(x =>
    (!PF.gc || x.gc === PF.gc) &&
    (!PF.rota || (PF.rota === "__sem" ? !x.rota : x.rota === PF.rota)) &&
    (!PF.dia || visitaTem(x.visita, PF.dia)) &&
    (PF.st === "todos" || (PF.st === "comprou" ? x.status !== "pendente" : x.status === "pendente")) &&
    (PF.b2b === "todos" || (PF.b2b === "sim" ? x.b2b === "Sim" : x.b2b !== "Sim")) &&
    (!q || norm(`${x.cliente} ${x.pv} ${x.produto} ${x.cod} ${x.rota || ""}`).includes(q))
  ).sort((a,b) => (a.status === "pendente" ? 0 : 1) - (b.status === "pendente" ? 0 : 1) || a.gc.localeCompare(b.gc) || a.cliente.localeCompare(b.cliente));
}

function vistaPlanificador(){
  if (PF.gc === null) PF.gc = minhaGC.get();
  const m = mesPlanificador();
  if (!m) return `<div class="vista-head"><div><h2>Planificador</h2></div></div><section class="dash"><p class="plan-vazio">A lista de clientes da Missão Guiada ainda não foi publicada.</p></section>`;
  const segm = (campo, ops) => `<span class="seg" role="group">${ops.map(([v,t]) => `<button data-pf="${campo}" data-v="${v}" aria-pressed="${PF[campo]===v}">${t}</button>`).join("")}</span>`;
  const base = m.clientes.filter(x => !PF.gc || x.gc === PF.gc);
  const rotas = [...new Set(base.map(x => x.rota).filter(Boolean))].sort((a,b) => a.localeCompare(b, "pt-BR", {numeric:true}));
  if (PF.rota && PF.rota !== "__sem" && !rotas.includes(PF.rota)) PF.rota = "";
  const temSemRota = base.some(x => !x.rota);
  const comprou = base.filter(x => x.status !== "pendente").length, semB2B = base.filter(x => x.b2b !== "Sim").length;
  const lg = PF.gc && m.calc ? m.calc.linhas.find(x => x.g === PF.gc) : null;
  const metaCon = lg && lg.detCon && lg.detCon.tipo === "missao" ? lg.detCon.base : null;
  const topo = PF.gc
    ? `<div class="plan-topo"><img src="${fig(PF.gc)}" alt="Figurinha da GC ${PF.gc} · ${plat(PF.gc)}" width="512" height="512"><div class="plan-kpis">`
    : `<div class="plan-topo" style="grid-template-columns:1fr"><div class="plan-kpis">`;
  return `<div class="vista-head"><div><h2>Planificador · Missão Guiada ${esc(m.nome)}</h2><p>Clientes da missão por Gerência. Filtre e baixe a lista em Excel para trabalhar com a carteira.</p></div>
      <button class="btn-xls" id="xls">⬇️ Exportar Excel</button></div>
    <section class="dash" style="margin-top:0">
      <div class="plan-filtros">
        <select id="pf-gc" aria-label="Gerência"><option value="">Todas as Gerências</option>${SIGLAS.map(g => `<option value="${g}" ${g===PF.gc?"selected":""}>GC ${g} · ${plat(g)}</option>`).join("")}</select>
        ${segm("st", [["todos","Todos"],["pendente","⏳ Pendentes"],["comprou","✅ Compraram"]])}
        ${segm("b2b", [["todos","B2B: todos"],["sim","Com cadastro"],["nao","Sem cadastro"]])}
        <select id="pf-rota" aria-label="Rota"><option value="">Todas as rotas</option>${rotas.map(r => `<option value="${esc(r)}" ${r===PF.rota?"selected":""}>Rota ${esc(r)}</option>`).join("")}${temSemRota ? `<option value="__sem" ${PF.rota==="__sem"?"selected":""}>Sem rota informada</option>` : ""}</select>
        <select id="pf-dia" aria-label="Dia de visita"><option value="">Todos os dias de visita</option>${DIAS.map(([d,n]) => `<option value="${d}" ${d===PF.dia?"selected":""}>Visita ${n}</option>`).join("")}</select>
        <input id="pf-q" type="search" placeholder="Buscar cliente, PV, produto ou rota" value="${esc(PF.q)}" aria-label="Buscar cliente, PV ou produto">
      </div>
      ${topo}
        <div class="kpi"><small>Clientes na missão</small><div>${base.length}</div></div>
        <div class="kpi"><small>Já compraram</small><div style="color:#8be889">${comprou}${metaCon ? ` <span>de ${metaCon} (meta)</span>` : ""}</div></div>
        <div class="kpi"><small>Pendentes</small><div style="color:#ff8fb8">${base.length - comprou}</div></div>
        <div class="kpi"><small>Sem cadastro B2B</small><div style="color:var(--yellow)">${semB2B}</div></div>
      </div></div>
      <div class="plan-tab tabela-wrap" id="pf-tab">${tabelaClientes(m)}</div>
    </section>`;
}

function tabelaClientes(m){
  const L = filtrarClientes(m);
  if (!L.length) return `<p class="plan-vazio">${PF.gc === "AT" && !m.clientes.some(x => x.gc === "AT") ? "A GC AT não tem clientes na Missão Guiada: o Conecta dela é medido pelo volume de Ades." : "Nenhum cliente com esses filtros."}</p>`;
  return `<table class="dt"><thead><tr><th>Gerência</th><th>Cliente</th><th>Rota</th><th>Visita</th><th>Produto foco</th><th>Status</th><th>Cadastro B2B</th><th>Observação</th></tr></thead><tbody>
    ${L.map(x => `<tr><td>GC ${x.gc}</td><td class="cli">${esc(x.cliente)}<small>PV ${esc(x.pv)}</small></td><td>${x.rota ? esc(x.rota) : '<span class="z">—</span>'}</td><td style="white-space:nowrap">${x.visita ? esc(x.visita) : '<span class="z">—</span>'}</td><td>${esc(x.produto)}<small style="display:block;color:var(--txt-3);font-size:11.5px">Cód. ${esc(x.cod)}</small></td>
      <td><span class="sc ${STATUS_CLI[x.status][0]}">${STATUS_CLI[x.status][1]}</span></td><td class="${x.b2b==="Sim"?"":"b2b-nao"}">${x.b2b==="Sim"?"Sim":"⭐ Não"}</td><td>${esc(x.obs)}</td></tr>`).join("")}
  </tbody></table><p class="plan-rod">${L.length} cliente${L.length===1?"":"s"} na lista · ⭐ cliente sem cadastro B2B que comprar vale destaque no Conecta.</p>`;
}

function ligarPlanificador(){
  const m = mesPlanificador(); if (!m) return;
  const sel = $("#pf-gc"); if (sel) sel.onchange = () => { PF.gc = sel.value; PF.rota = ""; minhaGC.set(sel.value); render(); };
  const sr = $("#pf-rota"); if (sr) sr.onchange = () => { PF.rota = sr.value; render(); };
  const sd = $("#pf-dia"); if (sd) sd.onchange = () => { PF.dia = sd.value; render(); };
  $("#app").querySelectorAll("[data-pf]").forEach(b => b.onclick = () => { PF[b.dataset.pf] = b.dataset.v; render(); });
  const q = $("#pf-q");
  if (q) q.oninput = () => { PF.q = q.value; $("#pf-tab").innerHTML = tabelaClientes(m); };
  const bx = $("#xls"); if (bx) bx.onclick = () => exportarExcel(m, bx);
}

/* Excel: carrega a biblioteca só quando alguém clica; se a internet bloquear, baixa em CSV (abre no Excel) */
let xlsxLib = null;
function carregarXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxLib) xlsxLib = new Promise((ok, erro) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = () => ok(window.XLSX); sc.onerror = () => { xlsxLib = null; erro(); };
    document.head.appendChild(sc);
  });
  return xlsxLib;
}
async function exportarExcel(m, botao){
  const L = filtrarClientes(m);
  const linhas = L.map(x => ({ "Gerência": "GC " + x.gc, "Plataforma": plat(x.gc), "PV": x.pv, "Cliente": x.cliente, "Rota": x.rota || "", "Dia de visita": x.visita || "", "Produto foco": x.produto,
    "Cód. produto": x.cod, "Status": STATUS_CLI[x.status][1].replace(/^\S+\s/, ""), "Cadastro B2B": x.b2b, "Observação": x.obs }));
  const nome = `planificador_${PF.gc ? "GC-" + PF.gc : "todas-GCs"}${PF.rota && PF.rota !== "__sem" ? "_rota-" + PF.rota : ""}${PF.dia ? "_" + PF.dia : ""}_${m.id}`;
  botao.disabled = true; const txt = botao.innerHTML; botao.textContent = "Gerando…";
  try {
    const X = await carregarXLSX();
    const ws = X.utils.json_to_sheet(linhas, { header: ["Gerência","Plataforma","PV","Cliente","Rota","Dia de visita","Produto foco","Cód. produto","Status","Cadastro B2B","Observação"] });
    ws["!cols"] = [{wch:9},{wch:13},{wch:10},{wch:34},{wch:8},{wch:16},{wch:32},{wch:12},{wch:16},{wch:13},{wch:32}];
    ws["!autofilter"] = { ref: ws["!ref"] };
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, "Planificador");
    X.writeFile(wb, nome + ".xlsx");
  } catch(e){
    const cab = Object.keys(linhas[0] || {"Gerência":1});
    const csv = "﻿" + [cab.join(";"), ...linhas.map(r => cab.map(k => `"${String(r[k] ?? "").replace(/"/g,'""')}"`).join(";"))].join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"})); a.download = nome + ".csv"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } finally { botao.disabled = false; botao.innerHTML = txt; }
}

/* ---------- detalhe de uma Gerência ---------- */
function cartaoDetalhe(g){
  const c = contexto(), l = c.L.find(x => x.g === g);
  const cab = `<div class="cab"><div class="esq"><img class="mini-fig" src="${fig(g)}" alt="" width="512" height="512"><div><div class="plat">${plat(g)}</div><div class="gcn">GC ${g}</div></div></div><div class="rk"><b>${l.rank}º</b><small>${c.tri ? "no trimestre" : "no ranking"}</small></div></div><p class="frase">${GCS[g][1]}</p>`;
  if (!c.tri){
    return `${l.status==="rei" ? `<span class="rib">👑 INFLUENCIADOR DO MÊS</span>` : ""}${cab}
      <div class="linha-st">${pill(l.status)}<span class="total">${f1(l.total)} <span>pontos</span></span></div>
      ${barra("ENGAJA", COR.engaja, l.eng, l.pE, REGRAS.engaja, "Del Valle Frut")}
      ${barra("CONECTA", COR.conecta, l.con, l.pC, l.regraCon, detConecta(l))}
      ${barra("ATIVA", COR.ativa, l.ati, l.pA, REGRAS.ativa, esc(c.m.ativaUsada) + (c.m.ativaHerdada ? " (produto a confirmar)" : ""))}
      <div class="legenda"><span><i style="background:rgba(255,255,255,.75)"></i>mínimo para pontuar</span><span><i style="background:var(--yellow)"></i>trava</span><span><i style="background:rgba(255,255,255,.35);width:1px"></i>100%</span></div>
      <div class="premio">${premioTxt(l.status)}</div>${timeHTML(l.pessoas)}`;
  }
  return `${l.status==="lider" ? `<span class="rib">🏆 LÍDER DO TRIMESTRE</span>` : ""}${cab}
    <div class="linha-st">${pill(l.status)}<span class="total">${f1(l.total)} <span>pontos</span></span></div>
    ${barra("ENGAJA ACUMULADO", COR.engaja, l.engAc, 0, {min:90,trava:130}, "Precisa de 90% para disputar o troféu", true)}
    <div class="meses-pts">${CONFIG.meses.map(m => `<div>${m.curto}<b>${l.porMes[m.id] === undefined ? "—" : f1(l.porMes[m.id])}</b></div>`).join("")}</div>
    ${timeHTML(l.pessoas)}`;
}

let ultimoFoco = null;
function abrirDetalhe(g){
  const c = contexto(), ord = ordemRank(c.L), i = ord.findIndex(x => x.g === g);
  if (i < 0) return;
  if (!$("#modal")) ultimoFoco = document.activeElement;
  fecharDetalhe(true);
  const l = ord[i], destaque = c.tri ? l.status === "lider" : l.status === "rei";
  const ant = ord[(i - 1 + ord.length) % ord.length], prox = ord[(i + 1) % ord.length];
  document.body.insertAdjacentHTML("beforeend", `<div class="modal" id="modal">
    <div class="card ${destaque?"rei":""}" role="dialog" aria-modal="true" aria-label="${plat(g)}" tabindex="-1">
      <button class="fechar" id="fechar" aria-label="Fechar">✕</button>
      ${cartaoDetalhe(g)}
      <div class="passo"><button data-gc="${ant.g}">‹ ${plat(ant.g)}</button><span>${i+1} de ${ord.length}</span><button data-gc="${prox.g}">${plat(prox.g)} ›</button></div>
    </div></div>`);
  const mo = $("#modal");
  mo.addEventListener("click", e => { if (e.target === mo) fecharDetalhe(); });
  $("#fechar").onclick = () => fecharDetalhe();
  mo.querySelectorAll(".passo button").forEach(b => b.onclick = () => abrirDetalhe(b.dataset.gc));
  mo.querySelector(".card").focus();
  mo.dataset.ant = ant.g; mo.dataset.prox = prox.g;
  document.body.style.overflow = "hidden";
}
function fecharDetalhe(trocando){
  const mo = $("#modal"); if (!mo) return;
  mo.remove();
  if (!trocando){ document.body.style.overflow = ""; if (ultimoFoco && document.contains(ultimoFoco)) ultimoFoco.focus(); }
}
document.addEventListener("keydown", e => {
  const mo = $("#modal"); if (!mo) return;
  if (e.key === "Escape") fecharDetalhe();
  if (e.key === "ArrowLeft") abrirDetalhe(mo.dataset.ant);
  if (e.key === "ArrowRight") abrirDetalhe(mo.dataset.prox);
});

/* =========================================================
   ESTADO, ABAS E CARREGAMENTO
   ========================================================= */
const STATE = { meses: [], aba: null, tri: null, avisos: [], visao: "resumo" };

function montarAbas(){
  const nav = $("#tabs");
  nav.innerHTML = STATE.meses.map(m => `<button class="tab" role="tab" data-aba="${m.id}" aria-selected="${STATE.aba===m.id}" ${m.calc?"":"disabled"}><span>${m.curto}${m.calc?"":"<small>em breve</small>"}</span></button>`).join("")
    + `<button class="tab tri" role="tab" data-aba="tri" aria-selected="${STATE.aba==="tri"}" ${STATE.tri && STATE.tri.meses.length ? "" : "disabled"}><span>Trimestre</span></button>`;
  nav.querySelectorAll(".tab").forEach(b => b.onclick = () => { STATE.aba = b.dataset.aba; render(); });
}

function montarNavbar(){
  let nav = $("#navbar");
  if (!nav){ document.body.insertAdjacentHTML("beforeend", `<nav class="navbar" id="navbar" aria-label="Telas do painel"></nav>`); nav = $("#navbar"); }
  nav.innerHTML = VISOES.map(([id, ic, nome]) => `<button data-visao="${id}" ${STATE.visao===id ? 'aria-current="page"' : ""}><span class="ic" aria-hidden="true">${ic}</span>${nome}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => irPara(b.dataset.visao));
}

function irPara(v){
  STATE.visao = v;
  render();
  window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

/* avisos discretos: um selo pequeno que abre a lista ao clicar */
function mostrarAvisos(lista){
  const av = $("#avisos");
  if (!lista.length){ av.hidden = true; av.innerHTML = ""; return; }
  av.hidden = false;
  av.innerHTML = `<button class="av-btn" aria-expanded="false" aria-controls="avPop">⚠️ ${lista.length} aviso${lista.length>1?"s":""} nos arquivos</button>
    <div class="av-pop" id="avPop" hidden><ul>${lista.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`;
  const bt = av.querySelector(".av-btn"), pop = $("#avPop");
  bt.onclick = e => { e.stopPropagation(); pop.hidden = !pop.hidden; bt.setAttribute("aria-expanded", String(!pop.hidden)); };
}
document.addEventListener("click", e => {
  const pop = $("#avPop"); if (pop && !pop.hidden && !e.target.closest("#avisos")){ pop.hidden = true; $("#avisos .av-btn").setAttribute("aria-expanded","false"); }
  document.querySelectorAll("details.como[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; });
});

function render(){
  montarAbas(); montarNavbar();
  const tri = STATE.aba === "tri";
  const m = STATE.meses.find(x => x.id === STATE.aba);
  const hoje = new Date();
  if (tri){
    $("#h1").textContent = "Placar do Trimestre";
    $("#periodo").innerHTML = "Outubro a Dezembro 2026 · soma dos pontos dos meses";
    const ult = STATE.tri.meses[STATE.tri.meses.length-1];
    $("#upd").innerHTML = `Atualizado: <b>${dataCurta(ult && ult.dataVol)}</b>`;
  } else {
    const [a, mm] = m.id.split("-").map(Number);
    const parcial = hoje < new Date(a, mm, 1);
    $("#h1").textContent = "Placar de " + m.nome;
    $("#periodo").innerHTML = `${m.nome} ${a} · Ativa: ${esc(m.ativaUsada)}${parcial ? '<span class="tag-parcial">parcial</span>' : ""}`;
    $("#upd").innerHTML = `Atualizado: volumes <b>${dataCurta(m.dataVol)}</b> · Missão Guiada <b>${m.dataMis ? dataCurta(m.dataMis) : "sem arquivo"}</b>`;
  }
  const html = STATE.visao === "ranking" ? vistaRanking() : STATE.visao === "gerencias" ? vistaGerencias() : STATE.visao === "planificador" ? vistaPlanificador() : vistaResumo();
  $("#app").innerHTML = `<div class="vista">${html}</div>`;

  $("#app").querySelectorAll("[data-gc]").forEach(el => {
    el.addEventListener("click", () => abrirDetalhe(el.dataset.gc));
    if (el.tagName === "TR") el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); abrirDetalhe(el.dataset.gc); } });
  });
  $("#app").querySelectorAll("[data-ir]").forEach(b => b.onclick = () => irPara(b.dataset.ir));
  const busca = $("#busca");
  if (busca) busca.onchange = () => { minhaGC.set(busca.value); PF.gc = busca.value; if (busca.value){ render(); abrirDetalhe(busca.value); } else render(); };
  if (STATE.visao === "planificador") ligarPlanificador();

  const av = $("#avisos");
  mostrarAvisos(STATE.avisos, false);
}

function processar(){
  STATE.avisos = [];
  STATE.meses.forEach(m => {
    m.calc = null;
    const P = m.placar; if (!P) return;
    if (P.mes !== m.id){ STATE.avisos.push(`${m.nome}: o arquivo ${CONFIG.arquivo(m.id)} foi gerado para o mês ${P.mes}. Gere de novo na ferramenta, escolhendo ${m.nome}.`); return; }
    m.ativaUsada = P.ativa || "—"; m.ativaHerdada = !!P.ativaAConfirmar;
    m.clientes = Array.isArray(P.clientes) ? P.clientes.filter(x => x && SIGLAS.includes(x.gc)) : [];
    m.dataVol = P.dataVolume ? new Date(P.dataVolume) : m.dataVol;
    m.dataMis = P.dataMissao ? new Date(P.dataMissao) : null;
    (P.avisos || []).forEach(a => STATE.avisos.push(String(a).startsWith(m.nome) ? a : `${m.nome} · ${a}`));
    m.calc = calcularMes(P);
  });
  STATE.tri = calcularTrimestre(STATE.meses);
  const comDados = STATE.meses.filter(m => m.calc);
  if (!STATE.aba || (STATE.aba !== "tri" && !comDados.find(m => m.id === STATE.aba))) STATE.aba = comDados.length ? comDados[comDados.length-1].id : null;
}

async function baixar(url){
  try{
    const r = await fetch(url + "?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return null;
    const placar = await r.json();
    const h = r.headers.get("last-modified");
    return { placar, data: h ? new Date(h) : null };
  } catch(e){ return null; }
}

async function iniciar(){
  STATE.meses = CONFIG.meses.map(m => ({...m}));
  await Promise.all(STATE.meses.map(async m => {
    const v = await baixar(`${CONFIG.pasta}/${CONFIG.arquivo(m.id)}`);
    if (v){ m.placar = v.placar; m.dataVol = v.data; }
  }));
  processar();
  if (!STATE.aba){
    $("#upd").textContent = "Sem dados publicados.";
    mostrarAvisos(STATE.avisos, false);
    $("#app").innerHTML = `<p class="estado">Nenhum placar encontrado. O arquivo do mês precisa estar na pasta <b>${CONFIG.pasta}/</b> com o nome <b>${CONFIG.arquivo("AAAA-MM")}</b> (por exemplo, ${CONFIG.arquivo("2026-10")}). Gere o arquivo na ferramenta Preparar placar e suba no GitHub.</p>`;
    return;
  }
  render();
}

iniciar();
</script>
